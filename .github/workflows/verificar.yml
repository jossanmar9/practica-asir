name: Verificar materiales

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comprobar catálogo y bancos de preguntas
        run: python3 scripts/verificar_repositorio.py
      - name: Comprobar sintaxis de JavaScript
        run: |
          node --check assets/app.js
